<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1700" viewBox="0 0 2400 1700">
  <defs>
    <style>
      .title { font: 700 44px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 22px Arial, sans-serif; fill: #4b5563; }
      .box { fill: #eff6ff; stroke: #2563eb; stroke-width: 3; rx: 10; }
      .header { fill: #dbeafe; stroke: #2563eb; stroke-width: 3; }
      .line { stroke: #2563eb; stroke-width: 2; }
      .class-title { font: 700 25px Arial, sans-serif; fill: #111827; text-anchor: middle; }
      .text { font: 20px Menlo, Consolas, monospace; fill: #111827; }
      .small { font: 18px Menlo, Consolas, monospace; fill: #111827; }
      .label { font: 19px Arial, sans-serif; fill: #374151; }
      .rel { stroke: #374151; stroke-width: 4; fill: none; }
      .dash { stroke-dasharray: 12 10; }
      .diamond { fill: #374151; stroke: #374151; stroke-width: 3; }
    </style>
    <marker id="inherit" markerWidth="18" markerHeight="18" refX="17" refY="9" orient="auto">
      <path d="M17,9 L1,1 L1,17 Z" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    </marker>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto">
      <path d="M1,1 L13,7 L1,13" fill="none" stroke="#374151" stroke-width="2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2400" height="1700" fill="#ffffff"/>
  <text x="60" y="70" class="title">ALTERDUNE - UML final</text>
  <text x="60" y="108" class="subtitle">Diagramme de classes aligne avec le code C++ de la soutenance TD15-TD16</text>

  <!-- Entity -->
  <rect x="60" y="160" width="430" height="420" class="box"/>
  <rect x="60" y="160" width="430" height="58" class="header"/>
  <text x="275" y="198" class="class-title">Entity</text>
  <line x1="60" y1="295" x2="490" y2="295" class="line"/>
  <text x="85" y="248" class="text">&lt;&lt;abstract&gt;&gt;</text>
  <text x="85" y="278" class="text">- name : string</text>
  <text x="85" y="325" class="text">- hp : int</text>
  <text x="85" y="355" class="text">- hpMax : int</text>
  <text x="85" y="385" class="text">- atk : int</text>
  <text x="85" y="415" class="text">- def : int</text>
  <line x1="60" y1="435" x2="490" y2="435" class="line"/>
  <text x="85" y="465" class="small">+ getName(), getHp(), getHpMax()</text>
  <text x="85" y="493" class="small">+ getAtk(), getDef(), isAlive()</text>
  <text x="85" y="521" class="small">+ takeDamage(), heal(), setHp()</text>
  <text x="85" y="549" class="small">+ displayStats() : void = 0</text>

  <!-- Player -->
  <rect x="650" y="160" width="430" height="390" class="box"/>
  <rect x="650" y="160" width="430" height="58" class="header"/>
  <text x="865" y="198" class="class-title">Player</text>
  <line x1="650" y1="305" x2="1080" y2="305" class="line"/>
  <text x="675" y="248" class="text">- inventory : vector&lt;Item&gt;</text>
  <text x="675" y="278" class="text">- kills : int</text>
  <text x="675" y="335" class="text">- spares : int</text>
  <text x="675" y="365" class="text">- victories : int</text>
  <line x1="650" y1="390" x2="1080" y2="390" class="line"/>
  <text x="675" y="420" class="small">+ getKills(), getSpares()</text>
  <text x="675" y="448" class="small">+ getVictories(), getInventory()</text>
  <text x="675" y="476" class="small">+ addKill(), addSpare(), addVictory()</text>
  <text x="675" y="504" class="small">+ addItem(), displayStats()</text>

  <!-- Item -->
  <rect x="1260" y="160" width="390" height="340" class="box"/>
  <rect x="1260" y="160" width="390" height="58" class="header"/>
  <text x="1455" y="198" class="class-title">Item</text>
  <line x1="1260" y1="335" x2="1650" y2="335" class="line"/>
  <text x="1285" y="248" class="text">- name : string</text>
  <text x="1285" y="278" class="text">- type : string</text>
  <text x="1285" y="308" class="text">- value : int</text>
  <text x="1285" y="365" class="text">- quantity : int</text>
  <line x1="1260" y1="392" x2="1650" y2="392" class="line"/>
  <text x="1285" y="422" class="small">+ getName(), getType()</text>
  <text x="1285" y="450" class="small">+ getValue(), getQuantity()</text>
  <text x="1285" y="478" class="small">+ setQuantity(), use()</text>

  <!-- Monster -->
  <rect x="650" y="610" width="480" height="440" class="box"/>
  <rect x="650" y="610" width="480" height="58" class="header"/>
  <text x="890" y="648" class="class-title">Monster</text>
  <line x1="650" y1="805" x2="1130" y2="805" class="line"/>
  <text x="675" y="698" class="text">&lt;&lt;abstract&gt;&gt;</text>
  <text x="675" y="728" class="text">- category : MonsterCategory</text>
  <text x="675" y="758" class="text">- mercy : int</text>
  <text x="675" y="788" class="text">- mercyGoal : int</text>
  <text x="675" y="835" class="text">- actIds : vector&lt;string&gt;</text>
  <text x="675" y="865" class="text">- killed, spared : bool</text>
  <line x1="650" y1="890" x2="1130" y2="890" class="line"/>
  <text x="675" y="920" class="small">+ modifyMercy(), getCategoryStr()</text>
  <text x="675" y="948" class="small">+ getMercy(), getMercyGoal()</text>
  <text x="675" y="976" class="small">+ getMaxActs() : int = 0</text>
  <text x="675" y="1004" class="small">+ clone() : Monster* = 0</text>

  <!-- Derived monsters -->
  <rect x="1330" y="590" width="420" height="145" class="box"/>
  <rect x="1330" y="590" width="420" height="58" class="header"/>
  <text x="1540" y="628" class="class-title">NormalMonster</text>
  <text x="1355" y="682" class="small">+ getMaxActs() : int { return 2 }</text>
  <text x="1355" y="710" class="small">+ clone() : Monster*</text>

  <rect x="1330" y="790" width="420" height="145" class="box"/>
  <rect x="1330" y="790" width="420" height="58" class="header"/>
  <text x="1540" y="828" class="class-title">MiniBossMonster</text>
  <text x="1355" y="882" class="small">+ getMaxActs() : int { return 3 }</text>
  <text x="1355" y="910" class="small">+ clone() : Monster*</text>

  <rect x="1330" y="990" width="420" height="145" class="box"/>
  <rect x="1330" y="990" width="420" height="58" class="header"/>
  <text x="1540" y="1028" class="class-title">BossMonster</text>
  <text x="1355" y="1082" class="small">+ getMaxActs() : int { return 4 }</text>
  <text x="1355" y="1110" class="small">+ clone() : Monster*</text>

  <!-- Game -->
  <rect x="60" y="650" width="440" height="350" class="box"/>
  <rect x="60" y="650" width="440" height="58" class="header"/>
  <text x="280" y="688" class="class-title">Game</text>
  <line x1="60" y1="825" x2="500" y2="825" class="line"/>
  <text x="85" y="738" class="text">- player : Player*</text>
  <text x="85" y="768" class="text">- monsterTemplates : vector</text>
  <text x="85" y="798" class="text">- bestiary : vector</text>
  <text x="85" y="855" class="text">- actCatalog : map</text>
  <text x="85" y="885" class="text">- rng : mt19937</text>
  <line x1="60" y1="910" x2="500" y2="910" class="line"/>
  <text x="85" y="940" class="small">+ run()</text>
  <text x="85" y="968" class="small">- mainMenu(), startCombat()</text>

  <!-- Combat -->
  <rect x="60" y="1120" width="500" height="360" class="box"/>
  <rect x="60" y="1120" width="500" height="58" class="header"/>
  <text x="310" y="1158" class="class-title">Combat</text>
  <line x1="60" y1="1285" x2="560" y2="1285" class="line"/>
  <text x="85" y="1208" class="text">- player : Player&amp;</text>
  <text x="85" y="1238" class="text">- actCatalog : map&amp;</text>
  <text x="85" y="1268" class="text">- bestiary : vector&amp;</text>
  <text x="85" y="1315" class="text">- rng : mt19937&amp;</text>
  <line x1="60" y1="1340" x2="560" y2="1340" class="line"/>
  <text x="85" y="1370" class="small">+ start(enemy : Monster*)</text>
  <text x="85" y="1398" class="small">- playerFight(), playerAct()</text>
  <text x="85" y="1426" class="small">- playerItem(), playerMercy()</text>
  <text x="85" y="1454" class="small">- monsterTurn(), randomDamage()</text>

  <!-- ActAction -->
  <rect x="650" y="1120" width="480" height="260" class="box"/>
  <rect x="650" y="1120" width="480" height="58" class="header"/>
  <text x="890" y="1158" class="class-title">ActAction</text>
  <line x1="650" y1="1270" x2="1130" y2="1270" class="line"/>
  <text x="675" y="1208" class="text">- id : string</text>
  <text x="675" y="1238" class="text">- text : string</text>
  <text x="675" y="1268" class="text">- mercyImpact : int</text>
  <line x1="650" y1="1300" x2="1130" y2="1300" class="line"/>
  <text x="675" y="1330" class="small">+ getId(), getText()</text>
  <text x="675" y="1358" class="small">+ getMercyImpact()</text>

  <!-- FileLoader -->
  <rect x="650" y="1460" width="480" height="170" class="box"/>
  <rect x="650" y="1460" width="480" height="58" class="header"/>
  <text x="890" y="1498" class="class-title">FileLoader</text>
  <line x1="650" y1="1535" x2="1130" y2="1535" class="line"/>
  <text x="675" y="1565" class="small">+ loadItems(filename, player)</text>
  <text x="675" y="1593" class="small">+ loadMonsters(filename, templates)</text>
  <text x="675" y="1621" class="small">- trim(str)</text>

  <!-- BestiaryEntry -->
  <rect x="1260" y="1240" width="440" height="360" class="box"/>
  <rect x="1260" y="1240" width="440" height="58" class="header"/>
  <text x="1480" y="1278" class="class-title">BestiaryEntry</text>
  <line x1="1260" y1="1415" x2="1700" y2="1415" class="line"/>
  <text x="1285" y="1328" class="text">- name : string</text>
  <text x="1285" y="1358" class="text">- category : string</text>
  <text x="1285" y="1388" class="text">- hpMax, atk, def : int</text>
  <text x="1285" y="1445" class="text">- killed : bool</text>
  <line x1="1260" y1="1470" x2="1700" y2="1470" class="line"/>
  <text x="1285" y="1500" class="small">+ getName(), getCategory()</text>
  <text x="1285" y="1528" class="small">+ getHpMax(), getAtk(), getDef()</text>
  <text x="1285" y="1556" class="small">+ wasKilled()</text>

  <!-- MonsterCategory -->
  <rect x="1830" y="760" width="360" height="230" class="box"/>
  <rect x="1830" y="760" width="360" height="58" class="header"/>
  <text x="2010" y="798" class="class-title">MonsterCategory</text>
  <text x="1855" y="848" class="text">&lt;&lt;enum&gt;&gt;</text>
  <text x="1855" y="892" class="text">NORMAL</text>
  <text x="1855" y="922" class="text">MINIBOSS</text>
  <text x="1855" y="952" class="text">BOSS</text>

  <!-- UI -->
  <rect x="1830" y="1100" width="420" height="300" class="box"/>
  <rect x="1830" y="1100" width="420" height="58" class="header"/>
  <text x="2040" y="1138" class="class-title">UI</text>
  <line x1="1830" y1="1175" x2="2250" y2="1175" class="line"/>
  <text x="1855" y="1205" class="small">+ showBestiary()</text>
  <text x="1855" y="1233" class="small">+ showStats()</text>
  <text x="1855" y="1261" class="small">+ showItems()</text>
  <text x="1855" y="1289" class="small">+ showEnding()</text>
  <text x="1855" y="1317" class="small">+ showGameOver()</text>
  <text x="1855" y="1345" class="small">+ readChoice()</text>

  <!-- Relationships -->
  <path d="M650 245 L490 245" class="rel" marker-end="url(#inherit)"/>
  <path d="M650 665 L490 405" class="rel" marker-end="url(#inherit)"/>
  <path d="M1330 662 L1130 720" class="rel" marker-end="url(#inherit)"/>
  <path d="M1330 862 L1130 805" class="rel" marker-end="url(#inherit)"/>
  <path d="M1330 1062 L1130 920" class="rel" marker-end="url(#inherit)"/>
  <polygon points="490,245 522,228 522,262" fill="#ffffff" stroke="#374151" stroke-width="4"/>
  <polygon points="490,405 522,388 522,422" fill="#ffffff" stroke="#374151" stroke-width="4"/>
  <polygon points="1130,720 1162,703 1162,737" fill="#ffffff" stroke="#374151" stroke-width="4"/>
  <polygon points="1130,805 1162,788 1162,822" fill="#ffffff" stroke="#374151" stroke-width="4"/>
  <polygon points="1130,920 1162,903 1162,937" fill="#ffffff" stroke="#374151" stroke-width="4"/>

  <polygon points="1080,255 1110,275 1080,295 1050,275" class="diamond"/>
  <path d="M1110 275 L1260 275" class="rel"/>
  <text x="1145" y="260" class="label">inventory</text>

  <polygon points="500,735 530,755 500,775 470,755" class="diamond"/>
  <path d="M530 755 L650 755" class="rel"/>
  <text x="540" y="735" class="label">monsterTemplates</text>

</svg>
